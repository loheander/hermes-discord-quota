name: hermes-discord-quota
version: 0.1.0
kind: standalone
description: "Discord user spending quota plugin with daily/weekly limits, 90% warning footers, mid-turn hard stops, and instant canned rejections."
author: "Lo Gullstrand Heander"
provides_hooks:
  - pre_gateway_dispatch
  - pre_llm_call
  - subagent_start
  - on_session_end
  - post_api_request
  - subagent_stop
  - pre_tool_call
  - transform_llm_output
